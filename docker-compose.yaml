services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_DSN: postgres://finote:finote@postgres:5432/finote?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_TIMEZONE: ${TELEGRAM_TIMEZONE:-Asia/Almaty}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    container_name: finote-postgres
    environment:
      POSTGRES_DB: finote
      POSTGRES_USER: finote
      POSTGRES_PASSWORD: finote
    ports:
      - "7432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finote -d finote"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
