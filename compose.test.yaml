name: finote-tests
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finote_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d finote_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      FINOTE_TEST_DATABASE_URL: postgres://test:test@postgres:5432/finote_test?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
